<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Priozen — Maquettes Responsive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   TOKENS — Light (default)
   ============================================================ */
:root {
  color-scheme: light;
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --bg-page: #F9FAFB;
  --bg-card: #FFFFFF;
  --bg-sidebar: #1E1B4B;
  --bg-sidebar-hover: #2D2A6E;
  --bg-input: #F1F5F9;
  --success: #10B981;
  --critique: #EF4444;
  --critique-bg: #FEF2F2;
  --schedule: #4F46E5;
  --schedule-bg: #EEF2FF;
  --delegate: #F59E0B;
  --delegate-bg: #FFFBEB;
  --secondary-c: #94A3B8;
  --secondary-bg: #F8FAFC;
  --text-primary: #1E293B;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --sidebar-text: rgba(255,255,255,0.65);
  --sidebar-text-active: #FFFFFF;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
}

/* ============================================================
   TOKENS — Dark
   ============================================================ */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --primary: #818CF8;
    --primary-light: #1E1B4B;
    --bg-page: #0A0918;
    --bg-card: #13111F;
    --bg-sidebar: #0A0918;
    --bg-sidebar-hover: #1E1B4B;
    --bg-input: #1E1C2E;
    --text-primary: #E0E7FF;
    --text-muted: #94A3B8;
    --border: #312E81;
    --critique-bg: #2D1515;
    --schedule-bg: #1E1B4B;
    --delegate-bg: #2D1F00;
    --secondary-bg: #0F0E1A;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #818CF8;
  --primary-light: #1E1B4B;
  --bg-page: #0A0918;
  --bg-card: #13111F;
  --bg-sidebar: #0A0918;
  --bg-sidebar-hover: #1E1B4B;
  --bg-input: #1E1C2E;
  --text-primary: #E0E7FF;
  --text-muted: #94A3B8;
  --border: #312E81;
  --critique-bg: #2D1515;
  --schedule-bg: #1E1B4B;
  --delegate-bg: #2D1F00;
  --secondary-bg: #0F0E1A;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #1a1730;
  color: var(--text-primary);
  min-height: 100%;
  padding: 0;
}

/* ============================================================
   DEVICE SELECTOR BAR (hors cadre)
   ============================================================ */
.device-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #0d0b1a;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.device-bar-title {
  font-family: 'DM Serif Display', serif;
  color: #818CF8;
  font-size: 18px;
  margin-right: 8px;
}
.device-btn {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.55);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.device-btn:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); }
.device-btn.active { background: #4F46E5; border-color: #4F46E5; color: #fff; }

.theme-toggle {
  margin-left: auto;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.theme-toggle:hover { background: rgba(255,255,255,0.07); color: #fff; }

/* ============================================================
   STAGE (conteneur centré pour la simulation)
   ============================================================ */
.stage {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px 48px;
  min-height: calc(100vh - 56px);
}

/* ============================================================
   PHONE FRAME (Mobile)
   ============================================================ */
.phone-frame {
  width: 390px;
  min-height: 780px;
  background: var(--bg-page);
  border-radius: 48px;
  border: 10px solid #1a1630;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 32px;
  background: #1a1630;
  border-radius: 0 0 20px 20px;
  z-index: 10;
}
.phone-screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: 36px;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg-page);
  scrollbar-width: none;
}
.phone-screen::-webkit-scrollbar { display: none; }

/* ============================================================
   TABLET FRAME
   ============================================================ */
.tablet-frame {
  width: 100%;
  max-width: 900px;
  min-height: 700px;
  background: var(--bg-page);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: row;
}

/* ============================================================
   DESKTOP FRAME
   ============================================================ */
.desktop-frame {
  width: 100%;
  max-width: 1200px;
  min-height: 700px;
  background: var(--bg-page);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: row;
}

/* ============================================================
   SIDEBAR (Tablet + Desktop)
   ============================================================ */
.sidebar {
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  padding: 24px 0 20px;
  overflow: hidden;
}
.sim-tablet .sidebar { width: 240px; }
.sim-desktop .sidebar { width: 260px; }

.sidebar-logo {
  font-family: 'DM Serif Display', serif;
  color: #fff;
  font-size: 24px;
  padding: 0 24px 28px;
  letter-spacing: -0.02em;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 8px;
}
.sidebar-logo span { color: #818CF8; }

.sidebar-nav { flex: 1; padding: 8px 12px; }
.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  color: var(--sidebar-text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.sidebar-nav-item:hover { background: var(--bg-sidebar-hover); color: var(--sidebar-text-active); }
.sidebar-nav-item.active { background: rgba(129,140,248,0.2); color: var(--sidebar-text-active); }
.sidebar-nav-item .nav-icon { display:inline-flex; justify-content:center; flex-shrink: 0; width: 22px; }
.sidebar-nav-item .nav-icon .ic { width:20px; height:20px; }
.ic { flex-shrink:0; vertical-align:-3px; }
.task-folder .ic { vertical-align:-2px; }
.bottom-nav-item .bn-icon { display:flex; justify-content:center; }

.sidebar-footer {
  padding: 16px 12px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.sidebar-user:hover { background: var(--bg-sidebar-hover); }
.sidebar-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4F46E5, #818CF8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.sidebar-user-info { overflow: hidden; }
.sidebar-user-name { color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-user-email { color: var(--sidebar-text); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============================================================
   MAIN CONTENT AREA (Tablet + Desktop)
   ============================================================ */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.main-header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  flex-shrink: 0;
}
.main-header-left h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.main-header-left p {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}
.header-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4F46E5, #818CF8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}
.main-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.sim-desktop .main-scroll { padding: 32px; }

/* Right panel (Desktop only) */
.right-panel {
  width: 280px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--bg-card);
  padding: 24px 20px;
  overflow-y: auto;
  display: none;
}
.sim-desktop .right-panel { display: block; }

/* ============================================================
   SCREEN MANAGEMENT
   ============================================================ */
.screen { display: none; width: 100%; }
.screen.active { display: block; }

/* Auth screens: jamais de sidebar */
.auth-screen-wrapper {
  width: 100%;
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background: var(--bg-page);
}

/* ============================================================
   BOTTOM NAV (Mobile uniquement)
   ============================================================ */
.bottom-nav {
  display: flex;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}
.bottom-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
  transition: color 0.15s;
}
.bottom-nav-item:hover, .bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item .bn-icon { font-size: 20px; line-height: 1; }

/* ============================================================
   MOBILE HEADER
   ============================================================ */
.mobile-header {
  padding: 14px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mobile-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.mobile-logo span { color: var(--primary); }
.mobile-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4F46E5, #818CF8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
}

/* ============================================================
   AUTH CARD
   ============================================================ */
.auth-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}
.auth-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  color: var(--text-primary);
  margin-bottom: 4px;
  text-align: center;
  letter-spacing: -0.02em;
}
.auth-logo span { color: var(--primary); }
.auth-tagline {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  margin-bottom: 28px;
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--primary); }
.form-input::placeholder { color: var(--text-muted); }
.btn-primary {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.9; }
.auth-link {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-muted);
}
.auth-link a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}
.auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.auth-divider::before, .auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.auth-divider span { color: var(--text-muted); font-size: 12px; }
.btn-google {
  width: 100%;
  padding: 10px;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  color: var(--text-primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* ============================================================
   TASK ITEM
   ============================================================ */
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.task-item:last-child { border-bottom: none; }
.task-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.task-check.done { background: var(--success); border-color: var(--success); color: #fff; font-size: 12px; }
.task-body { flex: 1; min-width: 0; }
.task-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.4;
}
.task-title.done { text-decoration: line-through; color: var(--text-muted); }
.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.task-folder {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 3px;
}
.task-date {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 20px;
}
.task-date.today { background: var(--schedule-bg); color: var(--primary); }
.task-date.late { background: var(--critique-bg); color: var(--critique); }
.task-date.future { background: var(--secondary-bg); color: var(--text-muted); }
.task-subtasks { font-size: 11px; color: var(--text-muted); }

/* ============================================================
   QUADRANT CARD
   ============================================================ */
.quadrant-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.quadrant-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.quadrant-label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.quadrant-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.quadrant-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.quadrant-count {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.quadrant-card.critique .quadrant-dot { background: var(--critique); }
.quadrant-card.critique .quadrant-name { color: var(--critique); }
.quadrant-card.schedule .quadrant-dot { background: var(--primary); }
.quadrant-card.schedule .quadrant-name { color: var(--primary); }
.quadrant-card.delegate .quadrant-dot { background: var(--delegate); }
.quadrant-card.delegate .quadrant-name { color: var(--delegate); }
.quadrant-card.secondary .quadrant-dot { background: var(--secondary-c); }
.quadrant-card.secondary .quadrant-name { color: var(--secondary-c); }

/* ============================================================
   BADGE
   ============================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge.critique { background: var(--critique-bg); color: var(--critique); }
.badge.schedule { background: var(--schedule-bg); color: var(--schedule); }
.badge.delegate { background: var(--delegate-bg); color: var(--delegate); }
.badge.secondary { background: var(--secondary-bg); color: var(--secondary-c); }

/* ============================================================
   SECTION TITLE (shared)
   ============================================================ */
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 16px;
}
.section-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

/* ============================================================
   GREETING BLOCK (Dashboard mobile)
   ============================================================ */
.greeting {
  padding: 20px 20px 0;
}
.greeting-sub { font-size: 13px; color: var(--text-muted); }
.greeting-name {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-top: 2px;
  text-wrap: balance;
}

/* ============================================================
   PROGRESS BAR
   ============================================================ */
.progress-bar-wrap {
  background: var(--bg-input);
  border-radius: 8px;
  height: 6px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--primary), #818CF8);
  transition: width 0.4s;
}

/* ============================================================
   STATS TILES
   ============================================================ */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.stat-tile {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  box-shadow: var(--shadow-sm);
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  line-height: 1;
}
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

/* ============================================================
   FOLDER CARD
   ============================================================ */
.folder-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s;
}
.folder-card:hover { box-shadow: var(--shadow-md); }
.folder-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.folder-info { flex: 1; min-width: 0; }
.folder-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.folder-count { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.folder-arrow { color: var(--text-muted); font-size: 18px; }

}

.focus-ring {
  width: 200px;
  height: 200px;
  border-radius: 50%;

  align-items: center;
  justify-content: center;
  margin-bottom: 40px;
  position: relative;
}
.focus-ring::before {
  content: '';

  inset: -3px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: #818CF8;
  border-right-color: #818CF8;
  animation: rotate 10s linear infinite;

/* ============================================================

   ============================================================ */
let currentScreen = "dashboard";
let currentDevice = "desktop";
let isDark = false;
let activeNavKey = "dashboard";

/* ============================================================
   DEVICE & THEME
   ============================================================ */
function setDevice(d) {
  currentDevice = d;
  document.body.className = 'sim-' + d;
  ['mobile','tablet','desktop'].forEach(k => {
    document.getElementById('btn-' + k).classList.toggle('active', k === d);
  });
  renderAll();
}

function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = isDark ? '☀️ Clair' : '🌙 Sombre';
}

function switchScreen(name) {
  if (name.indexOf('task-modal') === 0) {
    currentScreen = 'dashboard';
    activeNavKey = 'dashboard';
    modalState = name === 'task-modal-filled' ? 'filled' : name === 'task-modal-error' ? 'error' : 'empty';
    modalOpen = true;
    renderAll();
    return;
  }
  modalOpen = false;
  currentScreen = name;
  // Update nav active key
  const match = NAV_ITEMS.find(n => n.screen === name);
  if (match) activeNavKey = match.key;
  renderAll();
}

/* ============================================================
   RENDER DISPATCHER
   ============================================================ */
function renderAll() {
  buildSidebars();
  renderMobile();
  renderTablet();
  renderDesktop();
  renderModal();
}

/* ============================================================
   SIDEBAR BUILDER
   ============================================================ */
function buildSidebar(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = NAV_ITEMS.map(item => `
    <div class="sidebar-nav-item ${activeNavKey === item.key ? 'active' : ''}" onclick="switchScreen('${item.screen}')">
      <span class="nav-icon">${item.icon}</span>
      <span>${item.label}</span>
    </div>
  `).join('');
}

function buildSidebars() {
  buildSidebar('sidebar-nav-tablet');
  buildSidebar('sidebar-nav-desktop');
}

// ---- Task item HTML ----
function taskItemHTML(task, showQuadrant) {
  const q = showQuadrant ? QUADRANTS.find(x => x.key === task.quadrant) : null;
  const qDot = { critique: 'var(--critique)', schedule: 'var(--primary)', delegate: '#F59E0B', secondary: '#94A3B8' };
  return `
    <div class="task-item">
      <div class="task-check ${task.done ? 'done' : ''}">
        ${task.done ? ic('check', 14) : ''}
      </div>
      <div class="task-body">
        <div class="task-title ${task.done ? 'done' : ''}">${task.title}</div>
        <div class="task-meta">
          ${q ? `<span class="task-quad"><span class="task-quad-dot" style="background:${qDot[q.key]}"></span>${q.label}</span>` : ''}
          ${task.folder ? `<span class="task-folder">${task.folderIcon} ${task.folder}</span>` : ''}
          ${task.subtasks ? `<span class="task-subtasks">${task.subtasks.done}/${task.subtasks.total} sous-tâches</span>` : ''}
          ${task.date ? `<span class="task-date ${task.dateType}">${task.date}</span>` : ''}
        </div>
      </div>
    </div>`;
}

// ---- Quadrant card HTML ----
function quadrantCardHTML(q, tasks, isDesktop) {
  const qTasks = tasks.filter(t => t.quadrant === q.key);
  const count = qTasks.filter(t => !t.done).length;
  return `
    <div class="quadrant-card ${q.key}">
      <div class="quadrant-header">
        <div class="quadrant-label">
          <div class="quadrant-dot"></div>
          <span class="quadrant-name">${q.label}</span>
          <span style="font-size:11px;color:var(--text-muted)">${q.description}</span>
        </div>
        <span class="quadrant-count">${count}</span>
      </div>
      ${qTasks.map(t => taskItemHTML(t)).join('')}
    </div>`;
}

// ---- Vue d'ensemble : onglets (statut) + pastilles (quadrant) ----
let taskTab = 'todo';      // 'todo' | 'late' | 'done'
let mobileFilter = null;   // null | clé de quadrant
const TAB_LABELS = { todo: 'À faire', late: 'En retard', done: 'Terminées' };
const Q_DOT = { critique: 'var(--critique)', schedule: 'var(--primary)', delegate: '#F59E0B', secondary: '#94A3B8' };
function tabTasks(tab) {
  if (tab === 'done') return TASKS.filter(t => t.done);
  if (tab === 'late') return TASKS.filter(t => !t.done && t.dateType === 'late');
  return TASKS.filter(t => !t.done);
}
function setMobileFilter(key) { mobileFilter = (mobileFilter === key) ? null : key; renderAll(); }
function setTaskTab(tab) { taskTab = tab; renderAll(); }

function taskTabsHTML(device) {
  return `<div class="ov-tabs ${device === 'mobile' ? 'ov-tabs-fill' : ''}" role="tablist" aria-label="Statut des tâches">${['todo', 'late', 'done'].map(k => {
    const n = tabTasks(k).length;
    return `<button type="button" role="tab" class="ov-tab ${k === 'late' && n ? 'has-late' : ''}" aria-selected="${taskTab === k}" onclick="setTaskTab('${k}')">${TAB_LABELS[k]}<span class="ov-tab-count">${n}</span></button>`;
  }).join('')}</div>`;
}

function mobileOverviewStrip(completedCount, totalCount, pct, device) {
  const base = tabTasks(taskTab);
  const pills = QUADRANTS.map(q => {
    const n = base.filter(t => t.quadrant === q.key).length;
    const active = mobileFilter === q.key;
    const dim = mobileFilter && !active;
    return `<button type="button" class="ov-pill ${active ? 'active' : ''} ${dim ? 'dim' : ''}" aria-pressed="${active}" ${(n === 0 && !active) ? 'disabled' : ''} onclick="setMobileFilter('${q.key}')">
      <span class="ov-pill-top"><span class="ov-dot" style="background:${Q_DOT[q.key]}"></span><span class="ov-count">${n}</span></span>
      <span class="ov-label">${q.label}</span>
    </button>`;
  }).join('');
  return `<div class="ov-strip ov-${device}" aria-label="Vue d'ensemble">
    <div class="ov-pills">${pills}</div>
    <div class="ov-progress"><span>Aujourd'hui</span><div class="progress-bar-wrap" style="flex:1"><div class="progress-bar-fill" style="width:${pct}%"></div></div><strong>${completedCount}/${totalCount}</strong></div>
  </div>`;
}

function taskListHTML(device) {
  const list = mobileFilter ? tabTasks(taskTab).filter(t => t.quadrant === mobileFilter) : tabTasks(taskTab);
  const fq = mobileFilter ? QUADRANTS.find(x => x.key === mobileFilter) : null;
  const filterBar = fq ? `<div class="ov-filter-bar"><span>Filtre : ${fq.label} · ${list.length}</span><button type="button" onclick="setMobileFilter(null)">Tout afficher</button></div>` : '';
  if (taskTab === 'todo') {
    const qs = fq ? [fq] : QUADRANTS;
    const grid = device === 'desktop' && !fq;
    const cards = qs.map(q => quadrantCardHTML(q, list, grid)).join('');
    return filterBar + (grid ? `<div class="quadrant-grid-2x2">${cards}</div>` : cards);
  }
  const empty = taskTab === 'late' ? 'Aucune tâche en retard' : 'Aucune tâche terminée pour le moment';
  const title = TAB_LABELS[taskTab];
  return filterBar + `<div class="quadrant-card"><div class="quadrant-header"><div class="quadrant-label"><span class="quadrant-name" style="color:${taskTab === 'late' ? 'var(--critique)' : 'var(--text-primary)'}">${title}</span></div><span class="quadrant-count">${list.length}</span></div>${list.length ? list.map(t => taskItemHTML(t, true)).join('') : `<div class="ov-empty">${empty}</div>`}</div>`;
}

/* ============================================================
   MOBILE RENDER
   ============================================================ */
function renderMobile() {
  const el = document.getElementById('phone-screen-content');
  if (!el) return;

  const isAuth = ['login','register','forgot','cgu'].includes(currentScreen);

  let html = '';
  if (isAuth) {
    // Auth: centered, no notch area issues
    html = `<div style="display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px 16px;">${getAuthContent()}</div>`;
  } else if (currentScreen === 'dashboard') {
    html = screenDashboard('mobile');
  } else if (currentScreen === 'folder') {
    html = `
      <div class="mobile-header"><span class="mobile-logo">Prio<span>zen</span></span><div class="mobile-avatar">MD</div></div>
      <div style="padding:16px 16px 80px">${screenFolder()}</div>
      <div class="bottom-nav">${BOTTOM_NAV.map(item=>`<div class="bottom-nav-item ${item.key===activeNavKey?'active':''}" onclick="switchScreenMobile('${item.key}')"><span class="bn-icon">${item.icon}</span><span>${item.label}</span></div>`).join('')}</div>`;
  } else if (currentScreen === 'profile') {
    html = `
      <div class="mobile-header"><span class="mobile-logo">Prio<span>zen</span></span><div class="mobile-avatar">MD</div></div>
      <div style="padding:16px 16px 80px">${screenProfile()}</div>
      <div class="bottom-nav">${BOTTOM_NAV.map(item=>`<div class="bottom-nav-item ${item.key===activeNavKey?'active':''}" onclick="switchScreenMobile('${item.key}')"><span class="bn-icon">${item.icon}</span><span>${item.label}</span></div>`).join('')}</div>`;
  } else if (currentScreen === 'focus') {
    html = screenFocus('mobile');
  } else if (currentScreen === 'analytics') {
    html = screenAnalytics('mobile');
  } else if (currentScreen === 'trash') {
    html = screenTrash('mobile');
  } else if (currentScreen === 'empty') {
    html = screenEmpty('mobile');
  }
  el.innerHTML = html;
}

  if (currentScreen === 'cgu') return screenCGU();
  return '';

/* ============================================================
   MOBILE NAV
   ============================================================ */
function switchScreenMobile(key) {
  const map = { dashboard:'dashboard', folder:'folder', focus:'focus', analytics:'analytics', profile:'profile' };
  if (map[key]) {
    modalOpen = false;
    currentScreen = map[key];
    activeNavKey = key;
    document.getElementById('screen-select').value = currentScreen;
    renderAll();
  }
}
