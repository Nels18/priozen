name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    name: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR targets main only from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got '${{ github.head_ref }}')."
            exit 1
          fi
