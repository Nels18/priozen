name: Relecture Claude

# Mode économe : la relecture ne se lance que lorsqu'on ajoute le label
# « ai-review » à une PR, et jamais pour une PR qui ne touche pas au code.
# Une PR en brouillon n'est pas relue : si le label est posé pendant le
# brouillon, la relecture part au passage en « prête » (ready_for_review).
on:
  pull_request:
    branches: [develop]
    types: [labeled, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'package-lock.json'
      - 'assets/**'
      - 'public/**'

jobs:
  relecture:
    # Passage en « prête » : seulement si la PR porte déjà le label, pour
    # garder le mode économe (pas de relecture sans demande explicite).
    if: >-
      github.event.action == 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    uses: Nels18/dev-agents/.github/workflows/review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    with:
      agents-ref: v1
      modules: base,react,react-native,design-system,i18n
      model: sonnet
      max-turns: 15
      timeout-minutes: 10
      review-label: ai-review
    secrets: inherit
