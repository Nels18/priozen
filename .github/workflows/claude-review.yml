name: Relecture Claude

# Mode économe : seules les PR qui portent le label « ai-review » sont relues,
# et jamais une PR qui ne touche pas au code. La relecture part :
# - quand on ajoute le label ;
# - au passage en « prête » (label posé pendant le brouillon) ;
# - à chaque nouveau push sur la branche (synchronize), pour relire les
#   corrections. Un push qui arrive pendant une relecture l'annule et la
#   relance (concurrency du workflow partagé). Brouillons jamais relus.
on:
  pull_request:
    branches: [develop]
    types: [labeled, ready_for_review, synchronize]
    paths-ignore:
      - '**/*.md'
      - 'package-lock.json'
      - 'assets/**'
      - 'public/**'

jobs:
  relecture:
    # Passage en « prête » ou nouveau push : seulement si la PR porte déjà le
    # label, pour garder le mode économe (pas de relecture sans demande).
    if: >-
      github.event.action == 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    uses: Nels18/dev-agents/.github/workflows/review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    with:
      agents-ref: v1
      modules: base,react,react-native,design-system,i18n
      model: sonnet
      # Cost guard. 15 was too tight for a large PR: on #17 the review
      # finished its work in 17 turns, so the job failed although every
      # comment was posted.
      max-turns: 25
      timeout-minutes: 10
      review-label: ai-review
    secrets: inherit
