name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint & Tests
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (PR — changed files only)
        if: github.event_name == 'pull_request'
        run: npx vitest run --changed origin/${{ github.base_ref }} --coverage

      - name: Tests (push — full suite)
        if: github.event_name == 'push'
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [secret-scan, quality]
    if: always()

    steps:
      - name: Write pipeline summary
        run: |
          echo "## CI Pipeline — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ------ |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.secret-scan.result }}" = "success" ]; then
            echo "| Secret Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Secret Scan | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.quality.result }}" = "success" ]; then
            echo "| Lint & Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint & Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
