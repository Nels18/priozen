name: Deploy Web (demo)

# POC demo: every push on develop updates the "demo" alias, on mocked data.
# Variables of the EAS "preview" environment (set on expo.dev, not in Git):
#   EXPO_PUBLIC_USE_MOCKS=true  → MSW answers every API call
#   EXPO_PUBLIC_API_URL         → placeholder host MSW intercepts (required:
#                                 handlers only match the API host)
# Production stays on deploy-web.yml (tags v*).
on:
  push:
    branches: ['develop']
  workflow_dispatch: {}

jobs:
  deploy_web_demo:
    name: Deploy Web (demo)
    type: deploy
    environment: preview
    params:
      alias: demo
    hooks:
      # Demo only (production must stay indexable): written before the export
      # copies public/ into the build. The pages also carry a noindex meta
      # (app/+html.tsx).
      after_install_node_modules:
        - name: Block search engines
          run: |
            printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
